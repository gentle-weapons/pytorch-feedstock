# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

# if you wish to build release candidate number X, append the version string with ".rcX"
schema_version: 1

context:
  version: "2.10.0"
  build_base: 2
  # see https://github.com/pytorch/pytorch/blame/v${{ version }}/.ci/docker/ci_commit_pins/triton.txt
  triton: "3.6.0"

  # Tegra (NVIDIA Jetson) vs SBSA (ARM server) variant suffix for build strings
  # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/303
  tegra_suffix: ${{ "_tegra" if (arm_variant_type | default("sbsa")) == "tegra" else "" }}

  # Use a higher build number for the CUDA variant, to ensure that it's
  # preferred by conda's solver, and it's preferentially
  # installed where the platform supports it.
  build_number: ${{ build_base + (200 if cuda_compiler_version != "None" else 0) + (100 if blas_impl == "mkl" else 0) }}

  # Source URL (conditional on RC)
  src_url: ${{ "https://download.pytorch.org/source_code/test/pytorch-v" ~ version ~ ".tar.gz" if "rc" in version else "https://github.com/pytorch/pytorch/releases/download/v" ~ version ~ "/pytorch-v" ~ version ~ ".tar.gz" }}
  src_sha: ${{ "f35b2d7839b284410e5be9ec2eeb7a3049e09c1b8f6a871d3f2cad495d93dcd6" if "rc" in version else "fa8ccbe87f83f48735505371c1c313b4aa6db400b0ae4f8a02844d1e150c695f" }}

  # Build string components (reused across outputs)
  cuda_build_prefix: cuda${{ cuda_compiler_version | replace('.', '') }}${{ tegra_suffix }}_${{ blas_impl }}
  cpu_build_prefix: cpu_${{ blas_impl }}

  # Test files for pytorch-tests
  test_files: >-
    test/test_autograd.py
    test/test_autograd_fallback.py
    test/test_custom_ops.py
    test/test_linalg.py
    test/test_mkldnn.py
    test/test_modules.py
    test/test_nn.py
    test/test_torch.py
    test/test_xnnpack_integration.py

  # tests torch.compile; avoid on aarch because it adds >4h in test runtime in emulation;
  # they add a lot of runtime (15->60min on windows), so run them for only one python version
  test_files_inductor: ${{ " test/inductor/test_torchinductor.py" if python == "3.12" and not aarch64 and not osx else "" }}

  # Test skip patterns (built with conditionals)
  # a reasonably safe subset of tests that should run under 15 minutes
  skips: >-
    ${{
      "(TestTorch and test_print)"
      ~ (" or test_1_sized_with_0_strided_cpu_float32" if osx else "")
      ~ (" or test_batchnorm_nhwc_cpu" if unix else "")
      ~ (" or test_layer_norm_backwards_eps" if unix else "")
      ~ (" or test_pynode_destruction_deadlock" if aarch64 else "")
      ~ (" or (TestLinalgCPU and test_cholesky_cpu_float32)" if aarch64 else "")
      ~ (" or (TestLinalgCPU and test_pca_lowrank_cpu)" if aarch64 else "")
      ~ (" or (TestLinalgCPU and test_svd_lowrank_cpu)" if aarch64 else "")
      ~ (" or (TestMkldnnCPU and test_lstm_cpu)" if aarch64 else "")
      ~ (" or test_eigh_lwork_lapack" if aarch64 else "")
      ~ (" or test_gradgrad_nn_LSTM" if aarch64 else "")
      ~ (" or test_grad_nn_Transformer" if aarch64 else "")
      ~ (" or test_inverse_errors_large" if aarch64 else "")
      ~ (" or (TestXNNPACKConv1dTransformPass and test_conv1d_basic)" if aarch64 else "")
      ~ (" or test_addbmm or test_baddbmm or test_bmm" if aarch64 else "")
      ~ (" or illcondition_matrix_input_should_not_crash_cpu" if aarch64 and cuda_compiler_version != "None" else "")
      ~ " or (TestAutograd and test_profiler_seq_nr)"
      ~ " or (TestAutograd and test_profiler_propagation)"
      ~ " or test_mutable_custom_op_fixed_layout"
      ~ (" or (TestNN and test_upsampling_bfloat16)" if aarch64 else "")
      ~ (" or test_terminate_handler_on_crash" if aarch64 else "")
      ~ " or (TestTorch and test_tensor_cycle_via_slots)"
      ~ (" or test_forward_nn_Bilinear_mps_float16" if osx and arm64 else "")
      ~ (" or test_qengine" if osx and arm64 else "")
      ~ (" or test_LayerNorm_numeric_mps" if osx and arm64 else "")
      ~ " or test_cpp_warnings_have_python_context_cpu"
      ~ " or test_cpp_warnings_have_python_context_cuda"
      ~ " or test_lite_regional_compile_flex_attention_cuda"
      ~ (" or test_BCELoss_weights_no_reduce_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_ctc_loss_cudnn_tensor_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or (TestTorch and test_index_add_correctness)" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_sdpa_inference_mode_aot_compile" if linux and cuda_compiler_version != "None" else "")
      ~ (" or (TestNN and test_grid_sample)" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_cublas_config_nondeterministic_alert_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_cross_entropy_loss_2d_out_of_bounds_class" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_indirect_device_assert" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_reentrant_parent_error_on_cpu_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or (GPUTests and test_scatter_reduce2)" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_ck_blas_library_cpu" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_matmul_offline_tunableop_cuda_float16" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_Conv3d_1x1x1_no_bias_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_isinf_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_donated_buffer_inplace_gpt" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_linear_dynamic_maxautotune_cuda" if linux and cuda_compiler_version != "None" else "")
      ~ (" or (test_gradgrad_nn_Transformer and _cuda_)" if linux and cuda_compiler_version != "None" else "")
      ~ (" or test_avg_pool3d_backward2" if linux and cuda_compiler_version != "None" else "")
      ~ (" or (TestLinalgCPU and test_inverse_errors_large_cpu)" if linux and blas_impl == "mkl" and cuda_compiler_version != "None" else "")
      ~ (" or test_gather_scatter_cpu or test_index_put2_cpu" if linux and blas_impl != "mkl" and cuda_compiler_version != "None" else "")
      ~ (" or test_base_does_not_require_grad_mode_nothing" if not win else "")
      ~ (" or test_base_does_not_require_grad_mode_warn" if not win else "")
      ~ (" or test_composite_registered_to_cpu_mode_nothing" if not win else "")
      ~ (" or (TestMkldnnCPU and test_batch_norm_2d_cpu)" if win else "")
    }}

recipe:
  name: pytorch-cpu
  version: ${{ version | replace("-", ".") }}

source:
  url: ${{ src_url }}
  sha256: ${{ src_sha }}
  patches:
    - patches/0001-Force-usage-of-python-3-and-error-without-numpy.patch
    # conda-specific patch, lets us override CUDA paths
    - patches/0002-Allow-overriding-CUDA-related-paths.patch
    # fix BLAS calling convention for openblas
    - patches/0003-Use-BLAS_USE_CBLAS_DOT-for-OpenBLAS-builds.patch
    - patches/0004-Fix-FindOpenBLAS.patch
    # point to headers that are now living in $PREFIX/include instead of $SP_DIR/torch/include
    - patches/0005-point-include-paths-to-Conda-prefix-include-dir.patch
    - patches/0006-Add-conda-prefix-to-inductor-include-lib-paths.patch
    - patches/0007-make-ATEN_INCLUDE_DIR-relative-to-TORCH_INSTALL_PREF.patch
    - if: win
      then: patches/0008-remove-DESTINATION-lib-from-CMake-install-TARGETS-di.patch
    - patches/0009-avoid-deprecated-find_package-CUDA-in-caffe2-CMake-m.patch
    # skip a test that fails with numpy v2.3; still triggers as of pytorch v2.9
    - patches/0010-skip-test_norm_matrix_degenerate_shapes-on-numpy-2.3.patch
    # backport https://github.com/pytorch/pytorch/pull/127702
    - patches/0011-Define-PY_SSIZE_T_CLEAN-before-include-Python.h.patch
    # backport https://github.com/pytorch/pytorch/pull/166824
    - patches/0012-Add-USE_SYSTEM-options-for-KLEIDI-CUDNN_FRONTEND-CUT.patch
    - patches/0013-Fix-building-kineto-against-system-fmt.patch
    # backport https://github.com/pytorch/pytorch/pull/159828
    - patches/0014-Attempt-to-fix-torch.backends.cudnn.rnn-import.patch
    - patches/0015-Use-Intel-LLVM-openmp.patch
    # continued $PREFIX/include headers
    - patches/0016-Fix-TorchConfig.cmake.in-to-account-for-different-in.patch
    - patches_submodules/tensorpipe/0001-switch-away-from-find_package-CUDA.patch

build:
  number: ${{ build_number }}

outputs:
  #############################################################################
  # Output 1: libtorch (C++ library)
  #############################################################################
  - package:
      name: libtorch
      version: ${{ version | replace("-", ".") }}
    build:
      number: ${{ build_number }}
      # This logic allows two rc variants to be defined in the conda_build_config, but only one to actually be built.
      skip:
        - '"pytorch_rc" in channel_targets and "rc" not in version'
        - '"pytorch_rc" not in channel_targets and "rc" in version'
        # CUDA builds on GPU agents, non-CUDA builds on CPU agents
        - cuda_compiler_version == "None" and "gpu" in github_actions_labels
        - cuda_compiler_version != "None" and "cpu" in github_actions_labels
      string: ${{ cuda_build_prefix ~ "_h" ~ hash ~ "_" ~ build_number if cuda_compiler_version != "None" else cpu_build_prefix ~ "_h" ~ hash ~ "_" ~ build_number }}
      script:
        - if: unix
          then: build.sh
        - if: win
          then: bld.bat
      dynamic_linking:
        missing_dso_allowlist:
          - if: linux
            then: "*/libcuda.so.*"
          - if: win
            then: "*/nvcuda.dll"
      prefix_detection:
        ignore_binary_files: true
    requirements:
      # Keep this list synchronized (except for python*, numpy*) in outputs
      # We use python to build libtorch as well because it is easier
      build:
        # When you change 3.12 here, change it in build.sh/bld.bat as well
        - if: build_platform != target_platform
          then:
            - python 3.12
            - cross-python_${{ target_platform }}
            - numpy *
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: cuda_compiler_version != "None"
          then: ${{ compiler('cuda') }}
        - if: win
          then: libuv
        - llvm-openmp
        - cmake
        - ninja
        # Keep libprotobuf here so that a compatible version
        # of protobuf is installed between build and host
        - libprotobuf
        - protobuf
        - if: linux
          then: make
        - if: win
          then: sccache
        - if: unix
          then:
            - grep
            - rsync
      host:
        # GPU requirements
        - if: cuda_compiler_version != "None"
          then:
            - cuda-cudart-dev
            - cuda-cupti-dev
            - cuda-nvml-dev
            - cuda-nvrtc-dev
            - cuda-nvtx-dev
            - cuda-profiler-api
            - cuda-version ${{ cuda_compiler_version }}
            - cusparselt
            - libcublas-dev
            - libcudnn-dev
            - libcudss-dev
            - libcufft-dev
            - libcurand-dev
            - libcusolver-dev
            - libcusparse-dev
            - nvtx-c
        - if: cuda_compiler_version != "None" and linux
          then:
            - cuda-driver-dev
            - libcufile-dev
            - nccl
        - if: cuda_compiler_version != "None" and cuda_compiler_version != "12.8"
          then: libmagma-devel
        # cannot (yet) use libmagma-devel due to https://github.com/conda-forge/libmagma-feedstock/issues/32
        - if: cuda_compiler_version == "12.8"
          then: magma
        # other requirements
        - python 3.12
        - numpy *
        - pip
        - setuptools
        - pyyaml
        - requests
        - six
        - if: blas_impl == "mkl"
          then:
            - mkl-devel
            - libcblas * *_mkl
          else:
            - libblas
            - libcblas
            - liblapack
        - libabseil
        - libprotobuf
        - llvm-openmp
        - sleef
        - libuv
        - if: unix
          then: pkg-config
        - typing_extensions
        - pybind11
        - pybind11-abi
        - eigen
        - zlib
        - fmt
        - packaging
      run:
        - if: blas_impl == "mkl"
          then: libblas * *${{ blas_impl }}
      run_exports:
        - ${{ pin_subpackage('libtorch', upper_bound='x.x') }}
      run_constraints:
        # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/65
        - if: cuda_compiler_version == "None"
          then:
            - pytorch-cpu ${{ version | replace("-", ".") }}
            - pytorch-gpu <0.0a0
        - if: cuda_compiler_version != "None"
          then:
            - pytorch-gpu ${{ version | replace("-", ".") }}
            - pytorch-cpu <0.0a0
        - if: cuda_compiler_version != "None"
          then: pytorch ${{ version | replace("-", ".") }} ${{ cuda_build_prefix }}_*_${{ build_number }}
          else: pytorch ${{ version | replace("-", ".") }} ${{ cpu_build_prefix }}_*_${{ build_number }}
        # if using OpenBLAS, ensure that a version compatible with OpenMP is used
        - if: unix and blas_impl != "mkl"
          then:
            - libopenblas * openmp_*
            - openblas * openmp_*
      ignore_run_exports:
        by_name:
          - python
          - numpy
          - libmagma_sparse
        from_package:
          - python
          - numpy
          - if: build_platform != target_platform
            then: cross-python_${{ target_platform }}
    tests:
      - requirements:
          build:
            # cmake needs a compiler to run package detection
            - ${{ compiler('cxx') }}
            - if: cuda_compiler_version != "None"
              then:
                - ${{ compiler('cuda') }}
                # for CMake config to find cuda & nvrtc
                - cuda-nvrtc-dev
                - nvtx-c
          run:
            - cmake
            - ninja
            - pkg-config
        files:
          recipe:
            - cmake_test/
        script:
          # libraries - manually expanded (no for loops in rattler-build)
          - if: linux
            then:
              - test -f $PREFIX/lib/libc10.so
              - test -f $PREFIX/lib/libshm.so
              - test -f $PREFIX/lib/libtorch.so
              - test -f $PREFIX/lib/libtorch_cpu.so
              - test -f $PREFIX/lib/libtorch_global_deps.so
          - if: osx
            then:
              - test -f $PREFIX/lib/libc10.dylib
              - test -f $PREFIX/lib/libshm.dylib
              - test -f $PREFIX/lib/libtorch.dylib
              - test -f $PREFIX/lib/libtorch_cpu.dylib
              - test -f $PREFIX/lib/libtorch_global_deps.dylib
          - if: win
            then:
              - if not exist %LIBRARY_BIN%\c10.dll exit 1
              - if not exist %LIBRARY_BIN%\shm.dll exit 1
              - if not exist %LIBRARY_BIN%\torch.dll exit 1
              - if not exist %LIBRARY_BIN%\torch_cpu.dll exit 1
              - if not exist %LIBRARY_BIN%\torch_global_deps.dll exit 1
              - if not exist %LIBRARY_LIB%\c10.lib exit 1
              - if not exist %LIBRARY_LIB%\shm.lib exit 1
              - if not exist %LIBRARY_LIB%\torch.lib exit 1
              - if not exist %LIBRARY_LIB%\torch_cpu.lib exit 1
              # note: torch_global_deps has no .lib
          # CUDA-specific libraries (linux only: torch_cuda_linalg)
          - if: linux and cuda_compiler_version != "None"
            then:
              - test -f $PREFIX/lib/libtorch_cuda_linalg.so
              - test -f $PREFIX/lib/libc10_cuda.so
              - test -f $PREFIX/lib/libcaffe2_nvrtc.so
              - test -f $PREFIX/lib/libtorch_cuda.so
          - if: osx and cuda_compiler_version != "None"
            then:
              - test -f $PREFIX/lib/libc10_cuda.dylib
              - test -f $PREFIX/lib/libcaffe2_nvrtc.dylib
              - test -f $PREFIX/lib/libtorch_cuda.dylib
          - if: win and cuda_compiler_version != "None"
            then:
              - if not exist %LIBRARY_BIN%\c10_cuda.dll exit 1
              - if not exist %LIBRARY_BIN%\caffe2_nvrtc.dll exit 1
              - if not exist %LIBRARY_BIN%\torch_cuda.dll exit 1
              - if not exist %LIBRARY_LIB%\c10_cuda.lib exit 1
              - if not exist %LIBRARY_LIB%\caffe2_nvrtc.lib exit 1
              - if not exist %LIBRARY_LIB%\torch_cuda.lib exit 1
          # CMake files in share
          - if: linux
            then: test -f $PREFIX/share/cmake/Torch/TorchConfig.cmake
          - if: win
            then: if not exist %LIBRARY_PREFIX%\share\cmake\Torch\TorchConfig.cmake exit 1
          # test integrity of CMake metadata
          - cd cmake_test
          - if: unix
            then: cmake -GNinja -DCMAKE_CXX_STANDARD=17 $CMAKE_ARGS .
          - if: win
            then: cmake -GNinja -DCMAKE_CXX_STANDARD=17 %CMAKE_ARGS% .

  #############################################################################
  # Output 2: pytorch (Python bindings)
  #############################################################################
  - package:
      name: pytorch
      version: ${{ version | replace("-", ".") }}
    build:
      number: ${{ build_number }}
      skip:
        - '"pytorch_rc" in channel_targets and "rc" not in version'
        - '"pytorch_rc" not in channel_targets and "rc" in version'
        - cuda_compiler_version == "None" and "gpu" in github_actions_labels
        - cuda_compiler_version != "None" and "cpu" in github_actions_labels
      string: ${{ cuda_build_prefix ~ "_py" ~ (python | version_to_buildstring) ~ "_h" ~ hash ~ "_" ~ build_number if cuda_compiler_version != "None" else cpu_build_prefix ~ "_py" ~ (python | version_to_buildstring) ~ "_h" ~ hash ~ "_" ~ build_number }}
      script:
        - if: unix
          then: build.sh
        - if: win
          then: bld.bat
      prefix_detection:
        ignore_binary_files: true
    requirements:
      build:
        - python
        - if: build_platform != target_platform
          then:
            - cross-python_${{ target_platform }}
            - numpy
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: cuda_compiler_version != "None"
          then: ${{ compiler('cuda') }}
        - cmake
        - ninja
        # Keep libprotobuf here so that a compatible version
        # of protobuf is installed between build and host
        - libprotobuf
        - protobuf
        - if: linux
          then: make
        - if: win
          then: sccache
      host:
        - ${{ pin_subpackage('libtorch', exact=true) }}
        # GPU requirements
        - if: cuda_compiler_version != "None"
          then:
            - cuda-cudart-dev
            - cuda-cupti-dev
            - cuda-nvml-dev
            - cuda-nvrtc-dev
            - cuda-nvtx-dev
            - cuda-profiler-api
            - cuda-version ${{ cuda_compiler_version }}
            - cusparselt
            - libcublas-dev
            - libcudnn-dev
            - libcudss-dev
            - libcufft-dev
            - libcurand-dev
            - libcusolver-dev
            - libcusparse-dev
            - nvtx-c
        - if: cuda_compiler_version != "None" and linux
          then:
            - cuda-driver-dev
            - libcufile-dev
            - nccl
        - if: cuda_compiler_version != "None" and cuda_compiler_version != "12.8"
          then: libmagma-devel
        # cannot (yet) use libmagma-devel due to https://github.com/conda-forge/libmagma-feedstock/issues/32
        - if: cuda_compiler_version == "12.8"
          then: magma
        # other requirements
        - python
        - numpy
        - pip
        - setuptools
        - pyyaml
        - requests
        - six
        - if: blas_impl == "mkl"
          then:
            - mkl-devel
            - libcblas * *_mkl
          else:
            - libcblas
            - liblapack
        - libabseil
        - libprotobuf
        - llvm-openmp
        - pybind11
        - pybind11-abi
        - eigen
        - sleef
        - libuv
        - if: unix
          then: pkg-config
        - typing_extensions
        - zlib
        - fmt
        - packaging
      run:
        - ${{ pin_subpackage('libtorch', exact=true) }}
        - llvm-openmp
        - if: blas_impl == "mkl"
          then: libblas * *${{ blas_impl }}
          else: nomkl
        - if: cuda_compiler_version != "None" and not win
          then: triton ==${{ triton }}
        # avoid that people without GPUs needlessly download ~0.5-1GB
        - if: cuda_compiler_version != "None"
          then: __cuda
        - python
        # other requirements, see https://github.com/pytorch/pytorch/blame/main/requirements.txt
        - filelock
        - fsspec
        - jinja2
        - networkx
        - optree >=0.13.0
        - pybind11
        - setuptools
        - sympy >=1.13.3
        - typing_extensions >=4.10.0
      run_exports:
        - ${{ pin_subpackage('pytorch', upper_bound='x.x') }}
        - ${{ pin_subpackage('libtorch', upper_bound='x.x') }}
      run_constraints:
        # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/65
        - if: cuda_compiler_version == "None"
          then:
            - pytorch-cpu ${{ version | replace("-", ".") }}
            - pytorch-gpu <0.0a0
        - if: cuda_compiler_version != "None"
          then:
            - pytorch-gpu ${{ version | replace("-", ".") }}
            - pytorch-cpu <0.0a0
      ignore_run_exports:
        by_name:
          - libmagma_sparse

  #############################################################################
  # Output 3: pytorch-tests
  #############################################################################
  - package:
      name: pytorch-tests
      version: ${{ version | replace("-", ".") }}
    build:
      number: ${{ build_number }}
      skip:
        - '"pytorch_rc" in channel_targets and "rc" not in version'
        - '"pytorch_rc" not in channel_targets and "rc" in version'
        - cuda_compiler_version == "None" and "gpu" in github_actions_labels
        - cuda_compiler_version != "None" and "cpu" in github_actions_labels
      string: ${{ cuda_build_prefix ~ "_py" ~ (python | version_to_buildstring) ~ "_h" ~ hash ~ "_" ~ build_number if cuda_compiler_version != "None" else cpu_build_prefix ~ "_py" ~ (python | version_to_buildstring) ~ "_h" ~ hash ~ "_" ~ build_number }}
      prefix_detection:
        ignore_binary_files: true
    requirements:
      host:
        - python
      run:
        - if: cuda_compiler_version != "None"
          then: pytorch ${{ version | replace("-", ".") }} cuda*_${{ blas_impl }}_py${{ python | version_to_buildstring }}*${{ build_number }}
          else: pytorch ${{ version | replace("-", ".") }} cpu_${{ blas_impl }}_py${{ python | version_to_buildstring }}*${{ build_number }}
    tests:
      - python:
          imports:
            - torch
            - torch._C
      - requirements:
          build:
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            # for torch.compile tests
            - if: cuda_compiler_version != "None"
              then: ${{ compiler('cuda') }}
          run:
            - ninja
            - boto3
            - hypothesis
            # pytest-9 causes failure due to PytestRemovedIn9Warning
            # https://github.com/conda-forge/pytorch-cpu-feedstock/pull/448#issuecomment-3529016115
            - pytest <9
            - tabulate
            - pydot
            - pip
            - expecttest
            - xmlrunner
            - pyyaml
            # Required by run_test.py
            - pytest-flakefinder
            - pytest-rerunfailures
            - pytest-xdist
            # danpetry/TF: Pytorch includes their own edited version of pytest-shard and adding
            # it into the test deps as well results in the --shard-id option being added twice.
            # for cmake_test
            - cmake
            - if: cuda_compiler_version != "None"
              then:
                - cuda-nvrtc-dev
                - nvtx-c
            - pybind11
            # not required upstream, but useful
            - pytest-timeout
        files:
          recipe:
            - cmake_test/
          source:
            # Only include the source_files if we are actually going to run the tests.
            - test
            - tools
        script:
          # Run pip check so as to ensure that all pytorch packages are installed
          # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/24
          - pip check
          - python -c "import torch; print(torch.__version__)"
          - if: x86 and cuda_compiler_version == "None"
            then: python -c "import torch; assert torch.backends.mkldnn.m.is_available()"
          - python -c "import torch; torch.tensor(1).to('cpu').numpy(); print('numpy support enabled!!!')"
          # We have had issues with openmp .dylibs being doubly loaded in certain cases.
          - python -c "import torch; import numpy"
          - python -c "import numpy; import torch"
          - python -c "import numpy as np;import torch;x = torch.tensor([2], dtype=torch.complex128);res = torch.dot(x, x); assert res.real == 4.0, res"
          # distributed support is enabled by default on linux; for mac, we enable it manually in build.sh
          - if: linux or osx
            then: python -c "import torch; assert torch.distributed.is_available()"
          - if: cuda_compiler_version != "None"
            then:
              - python -c "import torch; assert torch.backends.cuda.is_built()"
              - python -c "import torch; assert torch.backends.cudnn.is_available()"
              - python -c "import torch; assert torch.backends.cudnn.enabled"
              - python -c "import torch; assert torch.version.cuda is not None"

          # python-version-specific library (default location in SP_DIR symlinks back to this)
          - if: unix
            then: test -f $PREFIX/lib/libtorch_python${SHLIB_EXT}
          - if: win
            then:
              - if not exist %LIBRARY_BIN%\torch_python.dll exit 1
              - if not exist %SP_DIR%\torch\lib\torch_python.lib exit 1
              - if not exist %SP_DIR%\torch\lib\_C.lib exit 1

          # the whole test suite takes forever, but we should get a good enough coverage
          # for potential packaging problems by running a fixed subset
          - if: unix
            then: export OMP_NUM_THREADS=4

          # the opengpu server has a card with sm_70, an architecture dropped by CUDA 13.0
          - if: not cuda_compiler_version.startswith("13") and (not aarch64 or python == "3.12")
            then:
              - >-
                pytest
                ${{ "-n 1" if linux and x86_64 and cuda_compiler_version != "None" else "-n 2" }}
                ${{ test_files }}${{ test_files_inductor }}
                -k "not (${{ skips }})"
                -m "not hypothesis" --durations=50 --timeout=1200 --disable-warnings

          # regression test for https://github.com/conda-forge/pytorch-cpu-feedstock/issues/329
          - if: not python.startswith("3.13") and unix
            then: test ! -f $SP_DIR/functorch/__pycache__/__init__.cpython-313.pyc
          - if: not python.startswith("3.13") and win
            then: if exist %SP_DIR%\functorch\__pycache__\__init__.cpython-313.pyc exit 1

          # test integrity of CMake metadata and ensure that THPLayoutType is visible as a symbol from libtorch_python
          - cd cmake_test
          - mkdir build build2
          - cd build
          - if: unix
            then:
              - cmake -GNinja -DCMAKE_CXX_STANDARD=17 -DWITH_TORCH_PYTHON=ON $CMAKE_ARGS ..
              - cmake --build .
          - if: win
            then:
              - cmake -GNinja -DCMAKE_CXX_STANDARD=17 -DWITH_TORCH_PYTHON=ON %CMAKE_ARGS% ..
              - cmake --build . --config Release
          - cd ../build2
          # regression test for https://github.com/conda-forge/pytorch-cpu-feedstock/issues/479
          - if: unix
            then:
              - cmake -GNinja -DCMAKE_CXX_STANDARD=17 -DWITH_TORCH_PYTHON=ON -DTorch_DIR=$SP_DIR/torch/share/cmake/Torch $CMAKE_ARGS ..
              - cmake --build .
          - if: win
            then:
              - cmake -GNinja -DCMAKE_CXX_STANDARD=17 -DWITH_TORCH_PYTHON=ON -DTorch_DIR=%SP_DIR%/torch/share/cmake/Torch %CMAKE_ARGS% ..
              - cmake --build . --config Release

  #############################################################################
  # Output 4: pytorch-cpu (metapackage, only when no CUDA)
  #############################################################################
  - package:
      name: pytorch-cpu
      version: ${{ version | replace("-", ".") }}
    build:
      number: ${{ build_number }}
      skip:
        - 'cuda_compiler_version != "None"'
        - '"pytorch_rc" in channel_targets and "rc" not in version'
        - '"pytorch_rc" not in channel_targets and "rc" in version'
        - '"gpu" in github_actions_labels'
      string: ${{ cpu_build_prefix }}_h${{ hash }}_${{ build_number }}
      prefix_detection:
        ignore_binary_files: true
    requirements:
      run:
        - pytorch ${{ version | replace("-", ".") }} ${{ cpu_build_prefix }}_*${{ build_number }}
    tests:
      - python:
          imports:
            - torch

  #############################################################################
  # Output 5: pytorch-gpu (metapackage, only when CUDA)
  #############################################################################
  - package:
      name: pytorch-gpu
      version: ${{ version | replace("-", ".") }}
    build:
      number: ${{ build_number }}
      skip:
        - 'cuda_compiler_version == "None"'
        - '"pytorch_rc" in channel_targets and "rc" not in version'
        - '"pytorch_rc" not in channel_targets and "rc" in version'
        - '"cpu" in github_actions_labels'
      string: ${{ cuda_build_prefix }}_h${{ hash }}_${{ build_number }}
      prefix_detection:
        ignore_binary_files: true
    requirements:
      run:
        - pytorch ${{ version | replace("-", ".") }} cuda*_${{ blas_impl }}_*${{ build_number }}
    tests:
      - python:
          imports:
            - torch

about:
  homepage: https://pytorch.org/
  repository: https://github.com/pytorch/pytorch
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - NOTICE
    - third_party/CMake/Copyright.txt
  summary: PyTorch is an optimized tensor library for deep learning using GPUs and CPUs.
  description: |
    PyTorch is a Python package that provides two high-level features:
      - Tensor computation (like NumPy) with strong GPU acceleration
      - Deep neural networks built on a tape-based autograd system
    You can reuse your favorite Python packages such as NumPy, SciPy, and Cython to extend PyTorch when needed.
  documentation: https://pytorch.org/docs/

